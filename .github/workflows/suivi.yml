name: Suivi des votes

on:
  schedule:
    - cron: "*/10 * * * *"   # toutes les 10 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write             # pour enregistrer votes.csv et les PNG dans le dépôt

concurrency:
  group: suivi
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python suivi_votes.py --once
      - name: Enregistrer les données
        run: |
          git config user.name "suivi-votes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add votes.csv votes_cumul.png votes_delta.png votes_normalise.png votes_total.png dashboard.html couleurs.json
          git diff --cached --quiet || git commit -m "relevé $(date -u +%FT%TZ)"
          git pull --rebase --quiet && git push
